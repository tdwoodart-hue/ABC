<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <!-- iPhone / iOS standalone + stable viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!--
      Journal post route bootstrap.

      LightHomeScreen currently decides the active top-level tab from pathname.
      Numeric routes such as /1 are real journal post URLs, but before React
      mounts we temporarily expose /journal so the Journal tab is selected.

      JournalTab reads the saved post number and restores /1 immediately after
      the journal data is available.
    -->
    <script>
      (() => {
        const match = window.location.pathname.match(/^\/([1-9]\d*)\/?$/);

        if (!match) return;

        try {
          window.sessionStorage.setItem(
            'us_pending_journal_post_number',
            match[1]
          );
        } catch {
          // Session storage can be unavailable in some private modes.
        }

        window.history.replaceState(
          { journalRouteBootstrap: true },
          '',
          '/journal'
        );
      })();
    </script>

    <!-- Home Screen / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      IMPORTANT:
      "default" keeps the app below the iPhone status bar.
      Do NOT use "black-translucent" here because it allows
      content to render underneath the clock / signal / battery area.
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta name="apple-mobile-web-app-title" content="Us" />
    <meta name="application-name" content="Us" />
    <meta name="theme-color" content="#fff1f2" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="apple-touch-icon" href="/icons/icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon.png" />

    <title>Us — Couple App</title>

    <meta
      name="description"
      content="Không gian riêng lưu giữ những kỷ niệm của hai đứa."
    />

    <meta property="og:title" content="Us — Couple App" />
    <meta
      property="og:description"
      content="Không gian riêng lưu giữ những kỷ niệm của hai đứa."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
